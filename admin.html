<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — Yellow Jack</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 2rem; background: #120c08; color: #f5f2eb; font-family: 'Source Serif 4', serif; }
    h1 { font-family: 'Rye', cursive; color: #d4af37; margin-bottom: 1.5rem; }
    .admin-container { max-width: 1000px; margin: 0 auto; }
    .app-card { background: #1a120b; border: 1px solid #3d2c1e; padding: 1.5rem; border-radius: 6px; margin-bottom: 1.5rem; }
    .app-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3d2c1e; padding-bottom: 0.8rem; margin-bottom: 1rem; }
    .badge { padding: 0.3rem 0.8rem; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
    .badge-en_attente { background: #d97706; color: #fff; }
    .badge-accepte { background: #15803d; color: #fff; }
    .badge-refuse { background: #b91c1c; color: #fff; }
    .app-body p { margin: 0.5rem 0; font-size: 0.95rem; }
    .app-body b { color: #d4af37; }
    .admin-actions { margin-top: 1rem; display: flex; gap: 1rem; }
    .btn-accept { background: #15803d; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .btn-refuse { background: #b91c1c; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .comment-box { margin-top: 0.8rem; font-style: italic; color: #fbbf24; background: rgba(212, 175, 55, 0.1); padding: 0.5rem; border-left: 3px solid #d4af37; }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1>Espace Staff — Candidatures Yellow Jack</h1>
    <p><a href="index.html" style="color: #d4af37; text-decoration: none;">← Retour au site</a></p>
    <div id="applications-list" style="margin-top: 2rem;">Chargement des candidatures...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://ribrhupnsocybyzznwsu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_NDLHFnFXdlHkSSNuPxWYKw_MxmXmZYh"; // Remets ta vraie clé complète

    async function loadApplications() {
      const container = document.getElementById('applications-list');
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/applications?select=*&order=created_at.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();

        if (data.length === 0) {
          container.innerHTML = "<p>Aucune candidature pour le moment.</p>";
          return;
        }

        container.innerHTML = data.map(app => `
          <div class="app-card">
            <div class="app-header">
              <h3>${app.first_name || ''} ${app.last_name || ''} (${app.age || '?'} ans)</h3>
              <span class="badge badge-${app.status || 'en_attente'}">${(app.status || 'en_attente').toUpperCase()}</span>
            </div>
            <div class="app-body">
              <p><b>Poste visé :</b> ${app.position || 'Non spécifié'} — Reçu le : ${new Date(app.created_at).toLocaleDateString()}</p>
              <p><b>Discord :</b> ${app.discord || 'Non renseigné'}</p>
              <p><b>Disponibilités :</b> ${app.availability || 'Non spécifié'}</p>
              <p><b>Expérience RP :</b><br>${app.experience || ''}</p>
              <p><b>Qualités & Défauts :</b><br>${app.traits || ''}</p>
              <p><b>Motivations :</b><br>${app.motivation || ''}</p>
              ${app.admin_comment ? `<div class="comment-box"><b>Motif / Note staff :</b> ${app.admin_comment}</div>` : ''}
              <div class="admin-actions">
                <button class="btn-accept" onclick="updateStatus(${app.id}, 'accepte')">Accepter</button>
                <button class="btn-refuse" onclick="updateStatus(${app.id}, 'refuse')">Refuser</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = "<p style='color: #f87171;'>Erreur lors du chargement des candidatures.</p>";
      }
    }

    async function updateStatus(id, newStatus) {
      const actionName = newStatus === 'accepte' ? 'accepter' : 'refuser';
      const reason = prompt(`Entrez la raison ou un commentaire pour ${actionName} cette candidature :`, "");
      
      if (reason === null) return; // Si l'admin clique sur Annuler

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/applications?id=eq.${id}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            status: newStatus,
            admin_comment: reason || "Aucune raison spécifiée"
          })
        });

        if (!res.ok) throw new Error("Erreur mise à jour");
        loadApplications();
      } catch (err) {
        alert("Erreur lors de la mise à jour du statut.");
      }
    }

    loadApplications();
  </script>
</body>
</html>
