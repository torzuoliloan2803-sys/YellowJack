<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administration — Yellow Jack</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .admin-body { background: #120d09; color: #f4ebd0; font-family: 'Source Serif 4', serif; padding: 2rem; }
      .admin-container { max-width: 1000px; margin: 0 auto; }
      .admin-card { background: #1a120b; border: 1px solid #3d2c1e; padding: 2rem; border-radius: 8px; margin-top: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
      .admin-card input { width: 100%; padding: 0.8rem; margin: 1rem 0; background: #0d0906; border: 1px solid #3d2c1e; color: #fff; border-radius: 4px; }
      .applications-grid { display: grid; gap: 1.5rem; margin-top: 2rem; }
      .app-item { background: #1a120b; border: 1px solid #3d2c1e; padding: 1.5rem; border-radius: 6px; position: relative; }
      .app-item.accepted { border-color: #2e7d32; }
      .app-item.rejected { border-color: #c62828; opacity: 0.7; }
      .app-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3d2c1e; padding-bottom: 0.8rem; margin-bottom: 1rem; }
      .app-actions { display: flex; gap: 1rem; margin-top: 1rem; }
      .btn-accept { background: #2e7d32; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; font-weight: bold; }
      .btn-refuse { background: #c62828; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; font-weight: bold; }
      .badge { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.85rem; text-transform: uppercase; }
      .badge.pending { background: #f57f17; color: #000; }
      .badge.accepted { background: #2e7d32; color: #fff; }
      .badge.rejected { background: #c62828; color: #fff; }
      .back-link { color: #d4af37; text-decoration: none; display: inline-block; margin-bottom: 1rem; }
    </style>
  </head>
  <body class="admin-body">
    <div class="admin-container">
      <a class="back-link" href="index.html">← Retour au site public</a>
      <h1>Panneau de Recrutement — Yellow Jack</h1>

      <!-- Connexion Staff -->
      <div id="login-box" class="admin-card">
        <h3>Accès Sécurisé Staff</h3>
        <p>Entrez le mot de passe administrateur pour voir les dossiers.</p>
        <input type="password" id="admin-password" placeholder="Mot de passe..." />
        <button class="button button-primary" id="login-btn" style="background:#d4af37; color:#120d09; border:none; padding:0.8rem 1.5rem; border-radius:4px; font-weight:bold; cursor:pointer;">Se connecter</button>
      </div>

      <!-- Dashboard -->
      <div id="dashboard" style="display: none;">
        <div class="admin-card" style="margin-top: 1rem; padding: 1rem; display: flex; justify-content: space-between; align-items: center;">
          <p><strong>Dossiers en attente :</strong> <span id="pending-count">0</span></p>
          <button onclick="loadApplications()" style="background:transparent; color:#d4af37; border:1px solid #d4af37; padding:0.4rem 0.8rem; cursor:pointer; border-radius:4px;">Actualiser</button>
        </div>
        <div id="applications-list" class="applications-grid"></div>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://ribrhupnsocybyzznwsu.supabase.co";
      const SUPABASE_KEY = "sb_publishable_NDLHFnFXdlHkSSNuPxWYKw_MxmXmZYh"; // Colle ta clé sb_publishable_... ici aussi
      const ADMIN_PASSWORD = "yellowjackpassword"; // Change le mot de passe staff si tu veux

      const loginBox = document.getElementById('login-box');
      const dashboard = document.getElementById('dashboard');
      const loginBtn = document.getElementById('login-btn');
      const passwordInput = document.getElementById('admin-password');
      const appsList = document.getElementById('applications-list');
      const pendingCount = document.getElementById('pending-count');

      loginBtn.addEventListener('click', () => {
        if (passwordInput.value === ADMIN_PASSWORD) {
          loginBox.style.display = 'none';
          dashboard.style.display = 'block';
          loadApplications();
        } else {
          alert('Mot de passe incorrect !');
        }
      });

      async function loadApplications() {
        appsList.innerHTML = `<p>Chargement des dossiers...</p>`;
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/applications?select=*&order=created_at.desc`, {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          });
          const data = await res.json();
          
          if (!Array.isArray(data) || data.length === 0) {
            appsList.innerHTML = `<p>Aucune candidature enregistrée pour le moment.</p>`;
            pendingCount.textContent = '0';
            return;
          }

          let pendingCountVal = 0;
          appsList.innerHTML = '';

          data.forEach(app => {
            if (app.status === 'pending') pendingCountVal++;

            const card = document.createElement('div');
            card.className = `app-item ${app.status}`;
            card.innerHTML = `
              <div class="app-header">
                <div>
                  <h3>${app.first_name} ${app.last_name} (${app.age} ans)</h3>
                  <small>Poste visé : <strong>${app.position}</strong> — Reçu le : ${new Date(app.created_at).toLocaleDateString()}</small>
                </div>
                <span class="badge ${app.status}">${app.status === 'pending' ? 'En attente' : app.status === 'accepted' ? 'Accepté' : 'Refusé'}</span>
              </div>
              <p><strong>Disponibilités :</strong> ${app.availability}</p>
              <p style="margin-top:0.5rem;"><strong>Expérience RP :</strong><br>${app.experience}</p>
              <p style="margin-top:0.5rem;"><strong>Qualités & Défauts :</strong><br>${app.traits}</p>
              <p style="margin-top:0.5rem;"><strong>Motivations :</strong><br>${app.motivation}</p>
              
              <div class="app-actions">
                <button class="btn-accept" onclick="updateStatus('${app.id}', 'accepted')">✅ Accepter</button>
                <button class="btn-refuse" onclick="updateStatus('${app.id}', 'rejected')">❌ Refuser</button>
              </div>
            `;
            appsList.appendChild(card);
          });

          pendingCount.textContent = pendingCountVal;
        } catch (err) {
          console.error(err);
          appsList.innerHTML = `<p style="color:#c62828;">Erreur lors du chargement des données depuis Supabase.</p>`;
        }
      }

      async function updateStatus(id, newStatus) {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/applications?id=eq.${id}`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({ status: newStatus })
          });

          if (!res.ok) throw new Error('Erreur mise à jour');
          loadApplications();
        } catch (err) {
          alert('Impossible de modifier le statut.');
        }
      }
    </script>
  </body>
</html>
