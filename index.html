<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recrutement - Yellow Jack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Formulaire de Recrutement</h1>
        
        <!-- Formulaire de candidature -->
        <form id="application-form">
            <div class="form-group">
                <label for="firstName">Prénom :</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>

            <div class="form-group">
                <label for="lastName">Nom :</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>

            <div class="form-group">
                <label for="age">Âge :</label>
                <input type="number" id="age" name="age" required>
            </div>

            <div class="form-group">
                <label for="position">Poste souhaité :</label>
                <input type="text" id="position" name="position" required>
            </div>

            <div class="form-group">
                <label for="availability">Disponibilités :</label>
                <input type="text" id="availability" name="availability" required>
            </div>

            <div class="form-group">
                <label for="discord">Nom Discord (ex: pseudo#0000 ou identifiant) :</label>
                <input type="text" id="discord" name="discord" required>
            </div>

            <div class="form-group">
                <label for="experience">Expérience :</label>
                <textarea id="experience" name="experience" required></textarea>
            </div>

            <div class="form-group">
                <label for="traits">Traits de caractère :</label>
                <textarea id="traits" name="traits" required></textarea>
            </div>

            <div class="form-group">
                <label for="motivation">Motivation :</label>
                <textarea id="motivation" name="motivation" required></textarea>
            </div>

            <!-- Champ anti-spam masqué -->
            <input type="text" name="company" style="display:none;" tabindex="-1" autocomplete="off">

            <button type="submit" class="submit-button">Envoyer ma candidature</button>
        </form>

        <!-- Zone d'affichage du statut d'envoi et du numéro de dossier -->
        <div id="form-status" style="margin-top: 20px; font-weight: bold; text-align: center;"></div>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid #444;">

        <!-- Zone de suivi en temps réel de la candidature -->
        <div class="tracking-container" style="text-align: center; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; border: 1px solid #555;">
            <h3 style="color: #fff; margin-bottom: 10px;">🔍 Suivre ma candidature</h3>
            <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 15px;">Entre le numéro de dossier qui t'a été attribué lors de l'envoi :</p>
            <div style="margin-top: 10px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                <input type="number" id="track-id" placeholder="Numéro de dossier" style="padding: 8px; border-radius: 5px; border: 1px solid #555; background: #222; color: #fff;">
                <button id="track-btn" style="padding: 8px 15px; background: #f59e0b; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: #000;">Vérifier</button>
            </div>
            <div id="track-result" style="margin-top: 15px; font-weight: bold;"></div>
        </div>

        <!-- Bouton secret pour accéder à la page admin -->
        <div style="margin-top: 50px; text-align: center;">
            <a href="#" id="secret-admin-btn" style="color: #666; font-size: 0.8rem; text-decoration: none;">Administration</a>
        </div>
    </main>

    <footer style="text-align: center; margin-top: 30px; padding: 20px; color: #666;">
        &copy; <span id="year"></span> - Tous droits réservés.
    </footer>

    <script src="script.js"></script>
</body>
</html>
