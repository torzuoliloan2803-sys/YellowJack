<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yellow Jack - Recrutement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="dossier-header">
            <span class="dossier-tag">Dossier</span>
            <h2>CANDIDATURE YELLOW JACK</h2>
            <p>Informations personnage — RP uniquement</p>
        </div>
        
        <!-- Formulaire de candidature aux bons libellés et IDs -->
        <form id="application-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="lastName">NOM DU PERSONNAGE *</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>

                <div class="form-group">
                    <label for="firstName">PRÉNOM DU PERSONNAGE *</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="age">ÂGE DU PERSONNAGE *</label>
                    <input type="number" id="age" name="age" required>
                </div>

                <div class="form-group">
                    <label for="position">POSTE VISÉ *</label>
                    <select id="position" name="position" required>
                        <option value="Barman">Barman</option>
                        <option value="Runner">Runner</option>
                        <option value="Animateur">Animateur</option>
                        <option value="Sécurité">Sécurité</option>
                        <option value="Responsable">Responsable</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="experience">EXPÉRIENCE RP & PASSIF *</label>
                <textarea id="experience" name="experience" rows="5" required></textarea>
            </div>

            <div class="form-group">
                <label for="traits">QUALITÉS & DÉFAUTS *</label>
                <textarea id="traits" name="traits" rows="4" required></textarea>
            </div>

            <div class="form-group">
                <label for="motivation">MOTIVATIONS *</label>
                <textarea id="motivation" name="motivation" rows="4" required></textarea>
            </div>

            <!-- Champ anti-spam masqué -->
            <input type="text" name="company" style="display:none;" tabindex="-1" autocomplete="off">

            <button type="submit" class="submit-button">Envoyer ma candidature</button>
        </form>

        <!-- Zone d'affichage du statut d'envoi -->
        <div id="form-status" style="margin-top: 20px; font-weight: bold; text-align: center;"></div>

        <!-- Bouton secret pour accéder à la page admin -->
        <div style="margin-top: 50px; text-align: center;">
            <a href="#" id="secret-admin-btn" style="color: #666; font-size: 0.8rem; text-decoration: none;">Administration</a>
        </div>
    </main>

    <footer style="text-align: center; margin-top: 30px; padding: 20px; color: #666;">
        &copy; <span id="year"></span> - Yellow Jack. Tous droits réservés.
    </footer>

    <script src="script.js"></script>
</body>
</html>
