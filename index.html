<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recrutement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ton formulaire de candidature existant -->
    <form id="application-form">
        <!-- Tes champs de formulaire... -->
        <button type="submit" class="submit-button">Envoyer</button>
    </form>
    
    <!-- L'endroit où le statut de l'envoi s'affiche -->
    <div id="form-status"></div>

    <!-- ===== AJOUTE CE BLOC ICI DANS TON INDEX.HTML ===== -->
    <div class="tracking-container" style="margin-top: 30px; text-align: center;">
      <h3>🔍 Suivre ma candidature</h3>
      <input type="number" id="track-id" placeholder="Numéro de dossier" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
      <button id="track-btn" style="padding: 8px 15px; background: #f59e0b; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Vérifier</button>
      <div id="track-result" style="margin-top: 15px; font-weight: bold;"></div>
    </div>
    <!-- ================================================ -->

    <!-- Ton script à la fin -->
    <script src="script.js"></script>
</body>
</html>
